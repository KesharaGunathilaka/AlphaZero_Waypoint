[project]
name = "backend"
version = "0.1.0"
description = "A FastAPI backend for the application."
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "asyncpg>=0.31.0",
    "fastapi[standard]>=0.141.1",
    "pyjwt>=2.14.0",
    "slowapi>=0.1.10",
    "sqlalchemy[asyncio]>=2.0.52",
    "svix>=2.5.0",
    "uvicorn[standard]>=0.52.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

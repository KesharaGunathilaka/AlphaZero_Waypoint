name: waypoint

services:
  # PostgreSQL 18 (Neon runs 18). On the FIRST start (empty volume) db/init/10-load-waypoint.sh
  # creates schema "wp" and loads data/general/*.csv. Later starts reuse the volume.
  db:
    image: postgres:18-alpine   # same major version as Neon
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-waypoint}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-waypoint}
      POSTGRES_DB: ${POSTGRES_DB:-waypoint}
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql   # PG 18 images keep data under /var/lib/postgresql/18
      - ./db/init:/docker-entrypoint-initdb.d:ro
      - ./db:/waypoint-db:ro
      - ./data/general:/waypoint-data:ro
    healthcheck:
      # -h 127.0.0.1: during first-start loading Postgres only listens on its socket,
      # so a TCP check stays "unhealthy" until schema and data are fully loaded.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ${POSTGRES_USER:-waypoint} -d ${POSTGRES_DB:-waypoint}"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  api:
    build: ./backend
    environment:
      ENVIRONMENT: development
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-waypoint}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-waypoint}
      POSTGRES_DB: ${POSTGRES_DB:-waypoint}
      ALLOWED_HOSTS: '["localhost", "127.0.0.1", "api"]'
      CORS_ORIGINS: '["http://localhost:${WEB_PORT:-3000}", "http://127.0.0.1:${WEB_PORT:-3000}"]'
      # Sign-in. "local" (default): the API checks the demo accounts' passwords itself, no outside
      # account needed. The deployed app uses Clerk (AUTH_MODE=clerk + the CLERK_* values).
      AUTH_MODE: ${AUTH_MODE:-local}
      LOCAL_AUTH_SECRET: ${LOCAL_AUTH_SECRET:-docker-local-only-secret-change-me-0123456789}
      CLERK_JWKS_URL: ${CLERK_JWKS_URL:-}
      CLERK_ISSUER: ${CLERK_ISSUER:-}
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY:-}
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:${API_PORT:-8000}   # the browser calls the API directly
        NEXT_PUBLIC_AUTH_MODE: ${AUTH_MODE:-local}
        NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY:-}
    environment:
      LOCAL_AUTH_SECRET: ${LOCAL_AUTH_SECRET:-docker-local-only-secret-change-me-0123456789}  # must match the api's
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY:-}
      API_INTERNAL_URL: http://api:8000                         # server-side calls stay inside the network
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
